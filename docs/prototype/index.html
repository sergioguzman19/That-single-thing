<title>That Single Thing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800;900&family=Overpass+Mono:wght@400;600&display=swap">
<style>
/* Layout: una columna; los carriles bajan desde arriba y convergen en V hacia la tarea única (el ápice). */
:root {
  color-scheme: dark;
  --bg: #111316;
  --surface: #1A1D21;
  --surface-2: #23272C;
  --line: #30353B;
  --fg: #ECEDEF;
  --muted: #8C929A;
  --paint: #F2C230;          /* pintura vial: el único acento */
  --paint-ink: #F2C230;
  --on-paint: #16130A;
  --rot: #FF6B57;
  --scrim: rgba(5, 6, 8, .62);
  --l-sky: #4FA3F0; --l-coral: #F07A5E; --l-violet: #9D8EF0;
  --l-green: #76C267; --l-teal: #2DB3A3; --l-rose: #E26BA5;
  --font-display: "Overpass", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "Overpass Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #E7E9EB; --surface: #F6F7F8; --surface-2: #DCDFE2; --line: #C7CCD1;
    --fg: #14171A; --muted: #5A6168; --paint: #F2C230; --paint-ink: #8A6400; --on-paint: #16130A;
    --rot: #C93E2A; --scrim: rgba(20, 23, 26, .45);
    --l-sky: #2F86D6; --l-coral: #D9583B; --l-violet: #7A68DA;
    --l-green: #4E9E40; --l-teal: #16907F; --l-rose: #C64B88;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #E7E9EB; --surface: #F6F7F8; --surface-2: #DCDFE2; --line: #C7CCD1;
  --fg: #14171A; --muted: #5A6168; --paint: #F2C230; --paint-ink: #8A6400; --on-paint: #16130A;
  --rot: #C93E2A; --scrim: rgba(20, 23, 26, .45);
  --l-sky: #2F86D6; --l-coral: #D9583B; --l-violet: #7A68DA;
  --l-green: #4E9E40; --l-teal: #16907F; --l-rose: #C64B88;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-display); font-size: 15px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--paint); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

.app { max-width: 960px; margin: 0 auto; padding-inline: 16px; padding-block: 0 140px; }

/* ---------- Header ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; padding-block: 16px 8px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; font-size: 14px; white-space: nowrap; }
.brand svg { width: 26px; height: 26px; flex: none; }
.sim { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.sim label { font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.sim select { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; max-width: 52vw; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(3, 1fr);
  background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs button { background: none; border: 0; padding: 14px 8px 12px; font-weight: 600; font-size: 14px; color: var(--muted); border-top: 3px solid transparent; }
.tabs button[aria-current="page"] { color: var(--fg); border-top-color: var(--paint); }
@media (min-width: 768px) {
  .tabs { position: static; display: flex; gap: 4px; background: none; border: 0; padding: 0; order: 0; }
  .tabs button { padding: 8px 14px; border-top: 0; border-bottom: 3px solid transparent; }
  .tabs button[aria-current="page"] { border-bottom-color: var(--paint); }
}

.fab { position: fixed; right: 16px; bottom: calc(72px + env(safe-area-inset-bottom, 0px)); z-index: 21; width: 56px; height: 56px; border-radius: 50%;
  border: 0; background: var(--paint); color: var(--on-paint); font-size: 30px; font-weight: 800; line-height: 1; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
@media (min-width: 768px) { .fab { bottom: 28px; right: max(28px, calc(50% - 480px + 16px)); } }

/* ---------- Notice ---------- */
.notice { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; border: 1px dashed var(--line); border-radius: 10px; padding: 10px 14px; margin-block: 8px 4px; font-size: 13px; color: var(--muted); }
.notice p { margin: 0; flex: 1 1 240px; }
.notice .row { display: flex; gap: 8px; }

/* ---------- Ahora / Merge ---------- */
.context { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 16px; margin-block: 18px 14px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); }
.pill .dot { width: 8px; height: 8px; }
.pill.warn { border-color: var(--paint); color: var(--paint-ink); }

.heads { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 6px; }
.head { position: relative; display: grid; gap: 2px; justify-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 4px 7px; min-width: 0; }
.head .name { font-weight: 600; font-size: 13px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.head .count { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.head .rotdot { position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--rot); }
.head.active { background: var(--surface-2); border-color: var(--lc); box-shadow: inset 0 -3px 0 var(--lc); }
.head.block:not(.active) { border-style: dashed; border-color: var(--lc); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--lc); flex: none; }

.roads { display: block; width: 100%; height: 96px; }
@media (min-width: 768px) { .roads { height: 130px; } }
.road { fill: none; stroke: var(--lc); stroke-width: 2; opacity: .28; vector-effect: non-scaling-stroke; }
.road.active { stroke-width: 4; opacity: 1; stroke-dasharray: 14 10; animation: flow 1.1s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -24; } }

.apex { width: 14px; height: 14px; margin: -7px auto 0; border-radius: 50%; background: var(--paint); box-shadow: 0 0 0 5px color-mix(in srgb, var(--paint) 25%, transparent); position: relative; z-index: 1; }

.thing { max-width: 680px; margin: -7px auto 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 28px 22px 22px; }
@media (min-width: 768px) { .thing { padding: 36px 36px 28px; } }
.thing .lane-tag { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.thing h2 { margin: 12px 0 10px; font-size: clamp(26px, 5.4vw, 40px); line-height: 1.08; font-weight: 900; letter-spacing: -.01em; text-wrap: balance; }
.thing .notes { margin: 0 0 16px; color: var(--muted); font-size: 16px; max-width: 60ch; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-bottom: 22px; }
.meta .rot { color: var(--rot); font-weight: 600; }
.meta .live { color: var(--paint-ink); font-weight: 600; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 11px 16px; font-weight: 600; font-size: 14px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--paint); border-color: var(--paint); color: var(--on-paint); font-weight: 800; }
.btn.small { padding: 6px 10px; font-size: 13px; border-radius: 8px; }
.btn.danger { color: var(--rot); }
.thing.empty h2 { font-size: clamp(22px, 4.4vw, 30px); }

.hint { max-width: 680px; margin: 14px auto 0; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted); }
.hint p { margin: 0; flex: 1 1 260px; }

.thing.leaving { transform: translateY(-28px) scale(.97); opacity: 0; transition: transform .32s ease-in, opacity .32s ease-in; }
.thing.entering { animation: rise .42s cubic-bezier(.2,.8,.2,1); }
@keyframes rise { from { transform: translateY(26px); opacity: 0; } }

/* ---------- Carriles ---------- */
.view-head { margin-block: 22px 8px; }
.view-head h1 { margin: 0 0 4px; font-size: 28px; font-weight: 900; }
.view-head p { margin: 0; color: var(--muted); max-width: 60ch; }
.lane-sec { border-top: 1px solid var(--line); padding-block: 18px; }
.lane-sec > header { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; margin-bottom: 10px; }
.lane-sec h2 { margin: 0; font-size: 18px; font-weight: 800; }
.lane-sec header .spacer { flex: 1; }
.rot-tag { font-family: var(--font-mono); font-size: 11px; color: var(--rot); border: 1px solid currentColor; border-radius: 99px; padding: 1px 8px; }
.queue { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 6px; }
.queue li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto auto; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 8px 8px 12px; }
.queue li.first { border-color: var(--lc); }
.pos { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.q-title { font-weight: 600; overflow-wrap: anywhere; }
.q-notes { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.age { font-family: var(--font-mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
.age.rot { color: var(--rot); font-weight: 600; }
.q-ctrl { display: flex; gap: 2px; }
.icon-btn { width: 32px; height: 32px; display: grid; place-items: center; border: 0; background: none; border-radius: 6px; color: var(--muted); font-size: 15px; }
.icon-btn:hover { background: var(--surface-2); color: var(--fg); }
.icon-btn:disabled { opacity: .25; cursor: default; background: none; }
.add-row { display: flex; gap: 8px; }
.field { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.field::placeholder { color: var(--muted); }
.empty-q { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
.new-lane { border-top: 1px solid var(--line); padding-block: 20px; display: grid; gap: 10px; }
.new-lane h2 { margin: 0; font-size: 16px; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatches label { position: relative; }
.swatches input { position: absolute; opacity: 0; }
.swatches span { display: block; width: 28px; height: 28px; border-radius: 50%; background: var(--lc); border: 3px solid transparent; }
.swatches input:checked + span { border-color: var(--fg); }
.swatches input:focus-visible + span { outline: 2px solid var(--paint); outline-offset: 2px; }

/* ---------- Semana ---------- */
.table-wrap { overflow-x: auto; margin-block: 16px; }
.week { width: 100%; border-collapse: separate; border-spacing: 6px; }
.week th { font-weight: 600; text-align: left; font-size: 13px; }
.week thead th { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 400; }
.week tbody th { width: 76px; }
.week td { padding: 0; }
.week select { width: 100%; min-width: 0; appearance: none; -webkit-appearance: none; border: 1px solid var(--line); border-radius: 8px; padding: 10px 8px; font-weight: 600; font-size: 13px;
  background: color-mix(in srgb, var(--lc, transparent) 22%, var(--surface)); }
.week select.free { color: var(--muted); font-weight: 400; background: var(--surface); }
.week td.now select { outline: 2px solid var(--paint); outline-offset: 1px; }
.balance { display: grid; gap: 8px; margin-block: 8px 20px; }
.balance h2 { margin: 0 0 4px; font-size: 16px; }
.bal-row { display: grid; grid-template-columns: 96px minmax(0, 1fr) 54px; align-items: center; gap: 10px; font-size: 13px; }
.bal-row .lname { display: flex; align-items: center; gap: 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--lc); border-radius: 4px; }
.bal-row .h { text-align: right; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }

/* ---------- Sheet & toast ---------- */
.sheet { position: fixed; inset: 0; z-index: 40; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; }
.sheet form { width: 100%; max-width: 560px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px 18px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; }
@media (min-width: 768px) { .sheet { align-items: center; } .sheet form { border-radius: 18px; padding: 24px; } }
.sheet h2 { margin: 0; font-size: 18px; font-weight: 800; }
.sheet textarea { resize: vertical; min-height: 64px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips label { position: relative; }
.chips input { position: absolute; opacity: 0; }
.chips span { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 99px; border: 1px solid var(--line); font-size: 13px; font-weight: 600; }
.chips input:checked + span { border-color: var(--lc); background: color-mix(in srgb, var(--lc) 20%, var(--surface)); }
.chips input:focus-visible + span { outline: 2px solid var(--paint); outline-offset: 2px; }
.check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.sheet .row { display: flex; justify-content: flex-end; gap: 8px; }

.toast { position: fixed; left: 50%; bottom: calc(140px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50; background: var(--fg); color: var(--bg);
  padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; max-width: calc(100% - 32px); width: max-content; }
@media (min-width: 768px) { .toast { bottom: 32px; } }

@media (prefers-reduced-motion: reduce) {
  .road.active { animation: none; }
  .thing.leaving, .thing.entering { transition: none; animation: none; }
}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 26 26" aria-hidden="true"><path d="M3 2 C3 13 13 12 13 24 M13 2 V24 M23 2 C23 13 13 12 13 24" fill="none" stroke="var(--paint)" stroke-width="2.4" stroke-linecap="round"/></svg>
      That Single Thing
    </div>
    <nav class="tabs" aria-label="Secciones">
      <button data-act="tab" data-tab="now">Ahora</button>
      <button data-act="tab" data-tab="lanes">Carriles</button>
      <button data-act="tab" data-tab="week">Semana</button>
    </nav>
    <div class="sim">
      <label for="sim">Simular</label>
      <select id="sim" data-act="sim"></select>
    </div>
  </header>
  <main id="view"></main>
</div>

<button class="fab" data-act="open-capture" aria-label="Capturar tarea">+</button>

<div class="sheet" id="sheet" hidden>
  <form data-form="capture" aria-labelledby="cap-title">
    <h2 id="cap-title">Capturar tarea</h2>
    <input class="field" id="cap-text" placeholder="¿Qué hay que hacer?" autocomplete="off" required>
    <textarea class="field" id="cap-notes" placeholder="Descripción (opcional)"></textarea>
    <div class="chips" id="cap-lanes" role="radiogroup" aria-label="Carril"></div>
    <label class="check"><input type="checkbox" id="cap-first"> Saltar la fila: ponerla de primera</label>
    <div class="row">
      <button type="button" class="btn" data-act="close-capture">Cancelar</button>
      <button type="submit" class="btn primary">Añadir a la cola</button>
    </div>
  </form>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script>
const DAY = 86400000;
const ROT_DAYS = 7;
const COLORS = ['sky', 'coral', 'violet', 'green', 'teal', 'rose'];
const SLOTS = [
  { id: 'am', name: 'Mañana', from: 6, to: 12 },
  { id: 'pm', name: 'Tarde', from: 12, to: 18 },
  { id: 'night', name: 'Noche', from: 18, to: 22 },
];
const DAYS = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
const DAYS_SHORT = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
const WEEK = [1, 2, 3, 4, 5, 6, 0];
const KEY = 'tst.proto.v1';

const uid = () => Math.random().toString(36).slice(2, 10);
const todayStr = () => new Date().toDateString();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function seed() {
  const now = Date.now();
  const t = (laneId, title, notes, days) => ({ id: uid(), laneId, title, notes, createdAt: now - days * DAY, startedAt: null });
  return {
    lanes: [
      { id: 'concejo', name: 'Concejo', color: 'sky' },
      { id: 'clientes', name: 'Clientes', color: 'coral' },
      { id: 'empresa', name: 'Empresa', color: 'violet' },
      { id: 'personal', name: 'Personal', color: 'green' },
      { id: 'hyrox', name: 'Hyrox', color: 'teal' },
    ],
    tasks: [
      t('concejo', 'Revisar el proyecto de acuerdo de presupuesto 2027', 'Leer articulado y anexos, marcar los artículos con riesgo jurídico y preparar observaciones para la comisión.', 10),
      t('concejo', 'Concepto jurídico sobre la ponencia de movilidad', 'Validar la competencia del Concejo y los antecedentes normativos.', 4),
      t('concejo', 'Preparar intervención para la sesión plenaria', 'Guion de 5 minutos con tres argumentos y cifras de soporte.', 2),
      t('concejo', 'Responder derecho de petición pendiente', 'Plazo legal: 15 días hábiles.', 1),
      t('clientes', 'Propuesta comercial para cliente nuevo', 'Alcance, cronograma y precio. Enviar antes del viernes.', 8),
      t('clientes', 'Informe mensual de resultados', 'Consolidar las métricas de septiembre y las recomendaciones.', 3),
      t('clientes', 'Agenda del kickoff del proyecto de octubre', '', 1),
      t('empresa', 'Conciliación contable de septiembre', 'Cruzar extractos bancarios con facturación y gastos.', 9),
      t('empresa', 'Renovar el contrato de arriendo de la oficina', 'Comparar condiciones y negociar el incremento.', 5),
      t('empresa', 'Revisar y aprobar la nómina de octubre', '', 2),
      t('personal', 'Agendar el chequeo médico anual', '', 12),
      t('personal', 'Planear el viaje de diciembre', 'Fechas, vuelos y presupuesto.', 6),
      t('hyrox', 'Sesión de intervalos: 8 × 1 km + wall balls', 'Ritmo objetivo de carrera y 20 wall balls entre series.', 1),
      t('hyrox', 'Inscripción a la próxima competencia', 'Revisar categoría y fecha límite.', 3),
      t('hyrox', 'Ajustar el plan de nutrición para el bloque de carga', '', 4),
    ],
    schedule: {
      1: { am: 'concejo', pm: 'clientes', night: 'hyrox' },
      2: { am: 'concejo', pm: 'empresa', night: null },
      3: { am: 'clientes', pm: 'concejo', night: 'hyrox' },
      4: { am: 'concejo', pm: 'clientes', night: null },
      5: { am: 'empresa', pm: 'personal', night: 'hyrox' },
      6: { am: 'hyrox', pm: 'personal', night: null },
      0: { am: null, pm: null, night: null },
    },
    override: null,
    sim: '2:am',
    done: { date: todayStr(), count: 0 },
    tab: 'now',
    notice: true,
  };
}

let state;
try { state = JSON.parse(localStorage.getItem(KEY)) || seed(); } catch { state = seed(); }
if (!state.done || state.done.date !== todayStr()) state.done = { date: todayStr(), count: 0 };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };

let pendingConfirm = null; // id de la acción destructiva que espera confirmación
let animateIn = false;

/* ---------- Modelo ---------- */
const lane = id => state.lanes.find(l => l.id === id);
const laneTasks = id => state.tasks.filter(t => t.laneId === id);
const firstTask = id => state.tasks.find(t => t.laneId === id) || null;
const ageDays = t => Math.floor((Date.now() - t.createdAt) / DAY);
const isRot = t => ageDays(t) >= ROT_DAYS;
const ageLabel = d => d === 0 ? 'hoy' : d === 1 ? '1 día' : `${d} días`;
const slotById = id => SLOTS.find(s => s.id === id);

function moment() {
  const d = new Date();
  if (state.sim === 'now') {
    const h = d.getHours();
    const s = SLOTS.find(s => h >= s.from && h < s.to);
    return { day: d.getDay(), slot: s ? s.id : null, real: true };
  }
  if (state.sim === 'off') return { day: d.getDay(), slot: null };
  const [day, slot] = state.sim.split(':');
  return { day: +day, slot };
}

// El carril con la tarea más vieja: lo que más se está pudriendo.
function mostAbandoned(exclude) {
  let best = null;
  for (const t of state.tasks) {
    if (t.laneId === exclude) continue;
    if (!best || t.createdAt < best.createdAt) best = t;
  }
  return best ? best.laneId : null;
}

function resolve() {
  const m = moment();
  const key = `${m.day}:${m.slot || '-'}`;
  let blockLaneId = m.slot ? (state.schedule[m.day] || {})[m.slot] : null;
  if (blockLaneId && !lane(blockLaneId)) blockLaneId = null;
  const base = { m, key, blockLaneId };
  if (state.override && state.override.key === key && lane(state.override.laneId)) {
    return { ...base, mode: 'manual', laneId: state.override.laneId };
  }
  if (blockLaneId) {
    if (firstTask(blockLaneId)) return { ...base, mode: 'block', laneId: blockLaneId };
    return { ...base, mode: 'empty', laneId: blockLaneId, suggest: mostAbandoned(blockLaneId) };
  }
  return { ...base, mode: 'free', laneId: mostAbandoned() };
}

function momentLabel(m) {
  if (!m.slot) return `${DAYS[m.day]} · fuera de bloque`;
  const s = slotById(m.slot);
  return `${DAYS[m.day]} · ${s.name} ${s.from}–${s.to} h`;
}

/* ---------- Vistas ---------- */
function laneStyle(l) { return `--lc: var(--l-${l.color})`; }

function viewNow() {
  const r = resolve();
  const task = r.laneId ? firstTask(r.laneId) : null;
  const L = r.laneId ? lane(r.laneId) : null;
  const B = r.blockLaneId ? lane(r.blockLaneId) : null;
  const n = state.lanes.length;

  const pill = {
    block: `<span class="pill" style="${laneStyle(L)}"><span class="dot"></span>Bloque de ${esc(L.name)}</span>`,
    manual: `<span class="pill warn">Fuera del plan</span>`,
    free: `<span class="pill">Modo libre</span>`,
    empty: `<span class="pill warn">Carril vacío</span>`,
  }[r.mode];

  const heads = state.lanes.map(l => {
    const ts = laneTasks(l.id);
    const rot = ts.some(isRot);
    const cls = ['head', l.id === r.laneId ? 'active' : '', l.id === r.blockLaneId ? 'block' : ''].join(' ');
    return `<button class="${cls}" style="${laneStyle(l)}" data-act="pick-lane" data-lane="${l.id}" aria-pressed="${l.id === r.laneId}"
      aria-label="${esc(l.name)}: ${ts.length} en cola${rot ? ', con tareas pudriéndose' : ''}">
      ${rot ? '<span class="rotdot" aria-hidden="true"></span>' : ''}
      <span class="name">${esc(l.name)}</span><span class="count">${ts.length}</span></button>`;
  }).join('');

  const roads = state.lanes.map((l, i) => {
    const x = ((i + .5) / n) * 1000;
    return `<path class="road ${l.id === r.laneId ? 'active' : ''}" style="${laneStyle(l)}" d="M${x} 0 C ${x} 115, 500 85, 500 200"/>`;
  }).join('');

  let card;
  if (task) {
    const ts = laneTasks(L.id);
    const d = ageDays(task);
    card = `<article class="thing ${animateIn ? 'entering' : ''}" id="thing">
      <span class="lane-tag" style="${laneStyle(L)}"><span class="dot"></span>${esc(L.name)}</span>
      <h2>${esc(task.title)}</h2>
      ${task.notes ? `<p class="notes">${esc(task.notes)}</p>` : ''}
      <div class="meta">
        <span>1 de ${ts.length} en la cola</span>
        <span class="${isRot(task) ? 'rot' : ''}">${isRot(task) ? 'Pudriéndose: ' : 'En cola '}${d === 0 ? 'desde hoy' : 'hace ' + ageLabel(d)}</span>
        ${task.startedAt ? `<span class="live">En curso desde ${new Date(task.startedAt).toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' })}</span>` : ''}
      </div>
      <div class="actions">
        <button class="btn primary" data-act="done" data-id="${task.id}">Hecho</button>
        <button class="btn" data-act="toggle-start" data-id="${task.id}">${task.startedAt ? 'Pausar' : 'Empezar'}</button>
        <button class="btn" data-act="to-back" data-id="${task.id}" ${ts.length < 2 ? 'disabled' : ''}>Mandar al final</button>
      </div>
    </article>`;
  } else if (!state.tasks.length) {
    card = `<article class="thing empty"><span class="lane-tag">Todo despachado</span><h2>No queda nada en ningún carril.</h2>
      <p class="notes">Captura lo siguiente con el botón + o descansa.</p></article>`;
  } else {
    const S = r.suggest ? lane(r.suggest) : null;
    card = `<article class="thing empty"><span class="lane-tag" style="${L ? laneStyle(L) : ''}"><span class="dot"></span>${esc(L ? L.name : '')}</span>
      <h2>${esc(L ? L.name : 'Este carril')} no tiene tareas.</h2>
      <p class="notes">El bloque quedó libre. Puedes traer la tarea más vieja de otro carril o capturar algo para ${esc(L ? L.name : 'este carril')}.</p>
      <div class="actions">
        ${S ? `<button class="btn primary" data-act="pick-lane" data-lane="${S.id}">Traer de ${esc(S.name)}</button>` : ''}
        <button class="btn" data-act="open-capture" data-lane="${L ? L.id : ''}">Capturar para ${esc(L ? L.name : 'el carril')}</button>
      </div></article>`;
  }

  let hint = '';
  if (r.mode === 'manual') {
    hint = `<p>Elegiste ${esc(L.name)}. ${B ? `Este bloque es de ${esc(B.name)}.` : 'Este momento no tiene bloque.'}</p>
      <button class="btn small" data-act="back-to-plan">Volver al plan</button>`;
  } else if (r.mode === 'free' && task) {
    hint = `<p>No hay bloque asignado ahora. Subió la tarea más vieja de todos tus carriles. Toca otro carril arriba para cambiar.</p>`;
  } else if (r.mode === 'block') {
    hint = `<p>Toca otro carril arriba para saltar el plan.</p>`;
  }

  const notice = state.notice ? `<div class="notice"><p>Estos son datos de ejemplo con tus frentes. Juega con ellos o empieza de cero.</p>
    <div class="row"><button class="btn small" data-act="clear-tasks">Empezar de cero</button><button class="btn small" data-act="dismiss-notice">Entendido</button></div></div>` : '';

  return `${notice}
    <div class="context">
      <span class="eyebrow">${momentLabel(r.m)}${state.done.count ? ` · ${state.done.count} hecha${state.done.count > 1 ? 's' : ''} hoy` : ''}</span>
      ${pill}
    </div>
    <div class="heads" style="--n:${n}">${heads}</div>
    <svg class="roads" viewBox="0 0 1000 200" preserveAspectRatio="none" aria-hidden="true">${roads}</svg>
    <div class="apex" aria-hidden="true"></div>
    ${card}
    ${hint ? `<div class="hint">${hint}</div>` : ''}`;
}

function viewLanes() {
  const sections = state.lanes.map(l => {
    const ts = laneTasks(l.id);
    const rot = ts.filter(isRot).length;
    const confirming = pendingConfirm === 'lane:' + l.id;
    const items = ts.map((t, i) => {
      const d = ageDays(t);
      return `<li class="${i === 0 ? 'first' : ''}">
        <span class="pos">${i + 1}</span>
        <span><span class="q-title">${esc(t.title)}</span>${t.notes ? `<span class="q-notes">${esc(t.notes)}</span>` : ''}</span>
        <span class="age ${isRot(t) ? 'rot' : ''}" title="En cola hace ${ageLabel(d)}">${d === 0 ? 'hoy' : d + ' d'}</span>
        <span class="q-ctrl">
          <button class="icon-btn" data-act="move" data-id="${t.id}" data-dir="-1" aria-label="Subir" ${i === 0 ? 'disabled' : ''}>↑</button>
          <button class="icon-btn" data-act="move" data-id="${t.id}" data-dir="1" aria-label="Bajar" ${i === ts.length - 1 ? 'disabled' : ''}>↓</button>
          <button class="icon-btn" data-act="remove-task" data-id="${t.id}" aria-label="Eliminar tarea">✕</button>
        </span></li>`;
    }).join('');
    return `<section class="lane-sec" style="${laneStyle(l)}">
      <header><span class="dot"></span><h2>${esc(l.name)}</h2><span class="mono muted" style="font-size:12px">${ts.length} en cola</span>
        ${rot ? `<span class="rot-tag">${rot} pudriéndose</span>` : ''}<span class="spacer"></span>
        <button class="btn small ${confirming ? 'danger' : ''}" data-act="del-lane" data-lane="${l.id}">${confirming ? `Confirmar: borrar con ${ts.length} tareas` : 'Eliminar carril'}</button>
      </header>
      ${ts.length ? `<ol class="queue">${items}</ol>` : `<p class="empty-q">Sin tareas. Escribe la primera abajo.</p>`}
      <form class="add-row" data-form="add-task" data-lane="${l.id}">
        <input class="field" id="add-${l.id}" placeholder="Añadir a ${esc(l.name)}…" autocomplete="off" aria-label="Nueva tarea para ${esc(l.name)}">
        <button class="btn">Añadir</button>
      </form></section>`;
  }).join('');

  const used = state.lanes.map(l => l.color);
  const free = COLORS.find(c => !used.includes(c)) || COLORS[0];
  const sw = COLORS.map(c => `<label style="--lc: var(--l-${c})"><input type="radio" name="nl-color" value="${c}" ${c === free ? 'checked' : ''} aria-label="Color ${c}"><span></span></label>`).join('');

  return `<div class="view-head"><h1>Carriles</h1>
      <p>El orden es la prioridad: la primera de cada cola es la que sube. Una tarea con ${ROT_DAYS} días o más se marca como pudriéndose.</p></div>
    ${sections}
    <form class="new-lane" data-form="new-lane">
      <h2>Nuevo carril</h2>
      <div class="add-row"><input class="field" id="nl-name" placeholder="Nombre del frente, p. ej. Familia" autocomplete="off" aria-label="Nombre del carril" required>
      <button class="btn">Crear</button></div>
      <div class="swatches">${sw}</div>
    </form>`;
}

function viewWeek() {
  const m = moment();
  const head = SLOTS.map(s => `<th scope="col">${s.name}<br>${s.from}–${s.to} h</th>`).join('');
  const rows = WEEK.map(d => {
    const cells = SLOTS.map(s => {
      const v = (state.schedule[d] || {})[s.id];
      const L = v ? lane(v) : null;
      const opts = `<option value="">Libre</option>` + state.lanes.map(l => `<option value="${l.id}" ${l.id === v ? 'selected' : ''}>${esc(l.name)}</option>`).join('');
      const now = m.day === d && m.slot === s.id;
      return `<td class="${now ? 'now' : ''}"><select id="s-${d}-${s.id}" data-act="sched" data-day="${d}" data-slot="${s.id}" class="${L ? '' : 'free'}"
        style="${L ? laneStyle(L) : ''}" aria-label="${DAYS[d]} ${s.name}">${opts}</select></td>`;
    }).join('');
    return `<tr><th scope="row">${DAYS[d]}</th>${cells}</tr>`;
  }).join('');

  const hours = {};
  for (const d of WEEK) for (const s of SLOTS) {
    const v = (state.schedule[d] || {})[s.id];
    if (v && lane(v)) hours[v] = (hours[v] || 0) + (s.to - s.from);
  }
  const max = Math.max(1, ...Object.values(hours));
  const bal = state.lanes.map(l => `<div class="bal-row" style="${laneStyle(l)}"><span class="lname"><span class="dot"></span>${esc(l.name)}</span>
    <span class="bar"><i style="width:${((hours[l.id] || 0) / max) * 100}%"></i></span><span class="h">${hours[l.id] || 0} h</span></div>`).join('');
  const confirming = pendingConfirm === 'reset';

  return `<div class="view-head"><h1>Semana</h1><p>Asigna cada bloque a un carril. Cuando llega el bloque, la tarea única sale de ese carril.</p></div>
    <div class="table-wrap"><table class="week"><thead><tr><th></th>${head}</tr></thead><tbody>${rows}</tbody></table></div>
    <div class="balance"><h2>Horas por carril a la semana</h2>${bal}</div>
    <button class="btn small ${confirming ? 'danger' : ''}" data-act="reset">${confirming ? 'Confirmar: volver a los datos de ejemplo' : 'Restaurar datos de ejemplo'}</button>`;
}

function render() {
  if (!['now', 'lanes', 'week'].includes(state.tab)) state.tab = 'now';
  document.getElementById('view').innerHTML = { now: viewNow, lanes: viewLanes, week: viewWeek }[state.tab]();
  animateIn = false;
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === state.tab ? 'page' : 'false'));
  renderSim();
}

function renderSim() {
  const sel = document.getElementById('sim');
  let html = `<option value="now">Hora real</option><option value="off">Fuera de bloque</option>`;
  for (const d of WEEK) html += SLOTS.map(s => `<option value="${d}:${s.id}">${DAYS_SHORT[d]} · ${s.name}</option>`).join('');
  sel.innerHTML = html;
  sel.value = state.sim;
}

/* ---------- Acciones ---------- */
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
}
function commit(msg) { save(); render(); if (msg) toast(msg); }

const act = {
  tab(d) { state.tab = d.tab; pendingConfirm = null; commit(); window.scrollTo(0, 0); },
  'pick-lane'(d) {
    const r = resolve();
    if (d.lane === r.blockLaneId) state.override = null;
    else state.override = { laneId: d.lane, key: r.key };
    animateIn = true;
    commit(d.lane === r.blockLaneId ? 'De vuelta al plan' : `Ahora: ${lane(d.lane).name}`);
  },
  'back-to-plan'() { state.override = null; animateIn = true; commit('De vuelta al plan'); },
  done(d) {
    const el = document.getElementById('thing');
    const t = state.tasks.find(x => x.id === d.id);
    if (!t) return;
    const finish = () => {
      state.tasks = state.tasks.filter(x => x.id !== d.id);
      state.done.count++;
      const left = laneTasks(t.laneId).length;
      animateIn = true;
      commit(left ? `Hecho. Sube la siguiente de ${lane(t.laneId).name}.` : `Hecho. ${lane(t.laneId).name} quedó vacío.`);
    };
    if (el && !matchMedia('(prefers-reduced-motion: reduce)').matches) { el.classList.add('leaving'); setTimeout(finish, 320); }
    else finish();
  },
  'toggle-start'(d) {
    const t = state.tasks.find(x => x.id === d.id);
    t.startedAt = t.startedAt ? null : Date.now();
    commit(t.startedAt ? 'En curso. Si se acaba el bloque, sigue de primera.' : 'Pausada. Sigue de primera en su carril.');
  },
  'to-back'(d) {
    const i = state.tasks.findIndex(x => x.id === d.id);
    const [t] = state.tasks.splice(i, 1);
    t.startedAt = null;
    state.tasks.push(t);
    animateIn = true;
    commit(`Mandada al final de ${lane(t.laneId).name}`);
  },
  move(d) {
    const t = state.tasks.find(x => x.id === d.id);
    const same = state.tasks.map((x, i) => [x, i]).filter(([x]) => x.laneId === t.laneId);
    const k = same.findIndex(([x]) => x.id === t.id);
    const other = same[k + Number(d.dir)];
    if (!other) return;
    const a = same[k][1], b = other[1];
    [state.tasks[a], state.tasks[b]] = [state.tasks[b], state.tasks[a]];
    commit();
  },
  'remove-task'(d) { state.tasks = state.tasks.filter(x => x.id !== d.id); commit('Tarea eliminada'); },
  'del-lane'(d) {
    if (pendingConfirm !== 'lane:' + d.lane) { pendingConfirm = 'lane:' + d.lane; return render(); }
    pendingConfirm = null;
    const name = lane(d.lane).name;
    state.lanes = state.lanes.filter(l => l.id !== d.lane);
    state.tasks = state.tasks.filter(t => t.laneId !== d.lane);
    for (const day in state.schedule) for (const s in state.schedule[day]) if (state.schedule[day][s] === d.lane) state.schedule[day][s] = null;
    commit(`Carril ${name} eliminado`);
  },
  reset() {
    if (pendingConfirm !== 'reset') { pendingConfirm = 'reset'; return render(); }
    pendingConfirm = null;
    state = seed(); state.tab = 'week';
    commit('Datos de ejemplo restaurados');
  },
  'clear-tasks'() { state.tasks = []; state.notice = false; commit('Carriles vacíos. Captura con el botón +'); },
  'dismiss-notice'() { state.notice = false; commit(); },
  'open-capture'(d) { openCapture(d.lane); },
  'close-capture'() { closeCapture(); },
};

document.addEventListener('click', e => {
  const b = e.target.closest('button[data-act]');
  if (!b || b.disabled) return;
  if (pendingConfirm && b.dataset.act !== 'del-lane' && b.dataset.act !== 'reset') pendingConfirm = null;
  act[b.dataset.act]?.(b.dataset, b);
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.act === 'sim') { state.sim = el.value; animateIn = true; commit(); }
  if (el.dataset.act === 'sched') {
    state.schedule[el.dataset.day] = state.schedule[el.dataset.day] || {};
    state.schedule[el.dataset.day][el.dataset.slot] = el.value || null;
    commit();
  }
});

document.addEventListener('submit', e => {
  const f = e.target;
  e.preventDefault();
  if (f.dataset.form === 'add-task') {
    const input = f.querySelector('input');
    const title = input.value.trim();
    if (!title) return;
    state.tasks.push({ id: uid(), laneId: f.dataset.lane, title, notes: '', createdAt: Date.now(), startedAt: null });
    commit();
    document.getElementById('add-' + f.dataset.lane)?.focus();
  }
  if (f.dataset.form === 'new-lane') {
    const name = f.querySelector('#nl-name').value.trim();
    if (!name) return;
    const color = (f.querySelector('input[name="nl-color"]:checked') || {}).value || 'sky';
    state.lanes.push({ id: 'l-' + uid(), name, color });
    commit(`Carril ${name} creado. Asígnale bloques en Semana.`);
  }
  if (f.dataset.form === 'capture') {
    const title = document.getElementById('cap-text').value.trim();
    const laneId = (document.querySelector('input[name="cap-lane"]:checked') || {}).value;
    if (!title || !laneId) return;
    const t = { id: uid(), laneId, title, notes: document.getElementById('cap-notes').value.trim(), createdAt: Date.now(), startedAt: null };
    if (document.getElementById('cap-first').checked) {
      const i = state.tasks.findIndex(x => x.laneId === laneId);
      state.tasks.splice(i < 0 ? state.tasks.length : i, 0, t);
    } else state.tasks.push(t);
    closeCapture();
    animateIn = state.tab === 'now';
    commit(`Añadida a ${lane(laneId).name}${document.getElementById('cap-first').checked ? ', de primera' : ''}`);
  }
});

function openCapture(preLane) {
  if (!state.lanes.length) { state.tab = 'lanes'; commit('Primero crea un carril'); return; }
  const r = resolve();
  const sel = (preLane && lane(preLane)) ? preLane : (r.laneId || state.lanes[0].id);
  document.getElementById('cap-lanes').innerHTML = state.lanes.map(l =>
    `<label style="${laneStyle(l)}"><input type="radio" name="cap-lane" value="${l.id}" ${l.id === sel ? 'checked' : ''}><span><span class="dot"></span>${esc(l.name)}</span></label>`).join('');
  document.getElementById('cap-text').value = '';
  document.getElementById('cap-notes').value = '';
  document.getElementById('cap-first').checked = false;
  document.getElementById('sheet').hidden = false;
  setTimeout(() => document.getElementById('cap-text').focus(), 30);
}
function closeCapture() { document.getElementById('sheet').hidden = true; }
document.getElementById('sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeCapture(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCapture(); });

setInterval(() => { if (state.sim === 'now' && state.tab === 'now') render(); }, 60000);
render();
</script>
