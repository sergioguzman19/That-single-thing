<!doctype html>
<html lang="es">
  <body style="margin:0;padding:0;background:#FFFFFF;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FFFFFF;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;font-family:'Hanken Grotesk',Helvetica,Arial,sans-serif;color:#16211D;">
            <tr>
              <td style="font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:#6B7370;padding-bottom:20px;">That Single Thing</td>
            </tr>
            <tr>
              <td style="font-family:Marcellus,Georgia,'Times New Roman',serif;font-size:28px;line-height:1.2;padding-bottom:12px;">Tu código para entrar</td>
            </tr>
            <tr>
              <td style="font-size:15px;line-height:1.5;color:#6B7370;padding-bottom:24px;">Escríbelo en la app. Vence en 10 minutos.</td>
            </tr>
            <tr>
              <td style="background:#F2F8FA;border:1px solid #DDEBEF;border-radius:6px;padding:20px;text-align:center;">
                <span style="font-family:'Geist Mono',Menlo,Consolas,monospace;font-size:34px;letter-spacing:0.3em;color:#16211D;">{{ .Token }}</span>
              </td>
            </tr>
            <tr>
              <td style="font-size:13px;line-height:1.5;color:#6B7370;padding-top:24px;">Si no pediste este código, ignora este correo. Nadie puede entrar sin él.</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
